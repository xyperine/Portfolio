<!DOCTYPE hmtl>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Arthur Mordvinov | Portfolio</title>
		<link rel="stylesheet" type="text/css" href="styles/main.css" />
		<script type="importmap">
			{
				"imports": {
					"#src/": "./src/",
					"three": "https://cdn.jsdelivr.net/npm/three@v0.185.1/build/three.module.js",
					"three/": "https://cdn.jsdelivr.net/npm/three@v0.185.1/",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.185.1/examples/jsm/",
					"@dimforge/rapier3d-compat": "https://cdn.skypack.dev/@dimforge/rapier3d-compat",
					"seedrandom": "https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js",
					"yaml": "https://cdn.jsdelivr.net/npm/yaml@2.8.1/browser/index.js",
					"three.quarks": "/node_modules/three.quarks/dist/three.quarks.esm.js",
					"quarks.core": "/node_modules/quarks.core/dist/quarks.core.esm.js"
				}
			}
		</script>

		<!-- Preload dark mode to avoid white flash. -->
		<script>
			if (localStorage.getItem("darkMode") === "true") {
				document.documentElement.classList.add("dark");
			}
		</script>
	</head>
	<body>
		<header>
			<a href="index.html">
				<hgroup class="tagged-title">
					<h1>Arthur Mordvinov</h1>
					<p id="subtitle" class="meta-tag">Unity Developer</p>
				</hgroup>
			</a>
			<div id="switches">
				<button id="dark-mode-switch" class="switch">Light</button>
				<p>/</p>
				<button id="mode-switch" class="switch">Simple</button>
			</div>
		</header>
		<main>
			<section id="game">
				<canvas id="terrain" tabindex="-1"></canvas>
				<div id="game-ui">
					<div class="hud">
						<p id="hud-title">PLANET SURVEY</p>
						<hr />
						<div class="hud-entry" id="planet-name">
							<span>PLN</span>
							<span>FSX-086f</span>
						</div>
						<div class="hud-entry" id="coord">
							<span>POS</span>
							<span>X: 132.1 Z: 83.5</span>
						</div>
						<div class="hud-entry" id="altitude">
							<span>ALT</span>
							<span>012m</span>
						</div>
						<div class="hud-entry" id="temperature">
							<span>TEM</span>
							<span>-86.4 ℃</span>
						</div>
						<div class="hud-entry" id="gravity">
							<span>GRV</span>
							<span>0.5 G</span>
						</div>
					</div>
					<div id="controls-hint">SHOW CONTROLS [TAB]</div>
					<div class="controls">
						<div class="content">
							<div class="title">
								CONTROLS
								<hr />
							</div>
							<div class="entry">
								<span>NAVIGATE</span>
								<span>[WASD]</span>
							</div>
							<div class="entry">
								<span>ORIENT</span>
								<span>[MOUSE]</span>
							</div>
							<div class="entry">
								<span>INTERACT</span>
								<span>[E]</span>
							</div>
							<div class="entry">
								<span>TELEPORT</span>
								<span>[1, 2, 3, 4, 5]</span>
							</div>
						</div>
					</div>
					<div id="compass">
						<div id="compass-strip"></div>
						<div id="compass-center"></div>
					</div>
					<div class="project-card">
						<button class="close">×</button>
						<div class="content">
							<img src="#" alt="Project Cover" />
							<div class="title"></div>
							<div class="meta-tag"></div>
							<div class="description"></div>
							<a
								class="learn"
								target="_blank"
								rel="noopener noreferrer"
							>
								learn more >>
							</a>
						</div>
					</div>
					<div id="crosshair"></div>
					<div id="interact-label">[INTERACT]</div>
				</div>
				<div id="fps-counter"></div>
			</section>
			<section class="projects-container"></section>
		</main>
		<footer>
			<p>© 2026 xyperine</p>
			<nav>
				<div class="footer-navigation">
					<p>
						<a
							href="https://github.com/xyperine"
							target="_blank"
							rel="noopener noreferrer"
						>
							GitHub
						</a>
					</p>
					<p>/</p>
					<p>
						<a
							href="https://xyperine.itch.io"
							target="_blank"
							rel="noopener noreferrer"
						>
							itch.io
						</a>
					</p>
					<p>/</p>
					<p>
						<a
							href="https://github.com/xyperine/site-test"
							target="_blank"
							rel="noopener noreferrer"
						>
							Site Source
						</a>
					</p>
				</div>
			</nav>
		</footer>
	</body>
	<script type="module" src="./src/main.js"></script>
</html>
