projects:
    conifer_init:
        name: "Conifer Init"
        metaTag: "Tool"
        description: "Unity plugin for automating project setup."
        coverImage: "img/Conifer Init cover.png"
        link: "project-page.html?id=conifer_init"
        color: "hsl(105, 70%, 50%)"

        interactive:
            number: 1

        page:
            media:
                type: "youtube"
                src: https://www.youtube.com/embed/5E8Atag36eY?si=FqS3YL0YYeqyxfOd
            description: |
                Conifer Init automates some common Unity project setup tasks such as folder structure creation, package installation, asset import, and project configuration.

                The feature set is based solely on what I need to do to set up a Unity project. I made this tool to automate and standardize the setup process for my future Unity projects, saving time and resources that can be spent on more important tasks.
            technology: |
                - Unity and C#
                - IMGUI for editor window
                - GitHub Pages
                - Doxygen
            features: |
                - Settings Profiles - tool configuration profiles reusable across many projects.
                - Asset database operations
                - Package management operations
                - Automated testing with GitHub Pages
                - Automated documentation generation with Doxygen and GitHub Pages
            storeLink: "https://github.com/xyperine/Conifer-Init"

    icons_creator:
        name: "Icons Creator"
        metaTag: "Tool"
        description: "Tool for creating icons of 3D objects in Unity."
        coverImage: "img/Icons Creator cover.png"
        link: "project-page.html?id=icons_creator"
        color: "hsl(180, 70%, 50%)"

        interactive:
            number: 2

        page:
            media:
                type: "youtube"
                src: "https://www.youtube.com/embed/5UHYbbjXDpM?si=6CMcJIE1WjeILplt"
            description: |
                This tool can create icons of any 3D object imported in Unity: prefabs, models, and objects on the opened scenes. Also you can make icons out of entire folders containing 3D objects.

                I did this tool to learn more about tooling and editor coding. It is based on a tool that I originally created for a game I was working on, but it was quite limited and required a lot of manual work to do to create icons. So I took the initial version of the tool, improved it, removed any external dependencies, and decided to make it public.
            technology: |
                - Unity and C#
                - IMGUI
                - URP
            features: |
                - Custom background and border
                - Can process entire folders with meshes and prefabs
                - Configure object size, icon resolution, icon name, and other parameters
                - Realtime preview
                - Batch export
            storeLink: "https://github.com/xyperine/Icons-Creator"

