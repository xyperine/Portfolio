        metaTag: "Game"
        description: "Incremental game about climbing up layers of simulations."
        coverImage: "img/Reality Grid cover.jpg"
        link: "project-page.html?id=reality_grid"
        color: "hsl(30, 70%, 50%)"

        interactive:
