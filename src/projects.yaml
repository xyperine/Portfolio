                src: "img/Reality Grid media.png"
                alt: "Screenshot"
            description: |
                Gradually unlock cells and upgrades and climb up the layers of simulations.
            technology: |
                - Unity and C#
                - ShaderGraph
            features: |
                - Game state persistence
                - Achievements
                - Prestige mechanic
                - Upgrades
            storeLink: "https://github.com/xyperine/Conifer-Init"

    dots_killer:
        name: "Dots Killer"
        metaTag: "Game"
        description: "PC/Web/Android incremental game."
        coverImage: "img/Dots Killer cover.png"
        link: "project-page.html?id=dots_killer"
        color: "hsl(330, 70%, 50%)"

        interactive:
